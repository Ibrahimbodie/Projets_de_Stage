embedding:
  provider: huggingface
  model: BAAI/bge-m3
  device: cpu

llm:
  provider: openrouter
  model: google/gemini-2.5-flash
  temperature: 0.2
  num_predict: 512
  request_timeout: 120

evaluation:
  provider: ollama
  model: qwen2.5:3b
  threshold: 0.75

retrieval:
  top_k: 6
  max_distance: 1.5
